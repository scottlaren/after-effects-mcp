<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>MCP Bridge</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
        background: var(--host-panel-background, #323232);
        color: #eee;
        font:
          11px/1.4 system-ui,
          sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100vh;
        min-height: 0;
        padding: 6px;
        gap: 5px;
      }
      p,
      h2 {
        margin: 0;
      }
      .history-heading {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      #status {
        min-width: 0;
        margin-inline-start: auto;
        max-width: 50%;
        text-align: end;
        overflow-wrap: anywhere;
        color: var(--host-panel-strong, #d1d1d1);
      }
      .history-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      button {
        flex-shrink: 0;
        min-height: 26px;
        padding: 3px 10px;
        font: inherit;
        color: #eee;
        background: #343434;
        border: 1px solid #515151;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #414141;
        border-color: #686868;
      }
      button:active:not(:disabled) {
        background: #303030;
      }
      button:disabled {
        color: #aaa;
        cursor: default;
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid #d1d1d1;
        outline-offset: 2px;
      }
      h2 {
        font-size: 11px;
        font-weight: 500;
        color: var(--host-panel-text, #bcbcbc);
      }
      .history-actions button {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        padding: 0;
      }
      .history-actions svg {
        grid-area: 1 / 1;
        width: 16px;
        height: 16px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #pause .icon-play,
      #pause.is-paused .icon-pause {
        display: none;
      }
      #pause.is-paused .icon-play {
        display: block;
      }
      #history {
        flex: 1 1 0;
        min-height: 0;
        overflow: hidden;
        overflow-wrap: anywhere;
        padding: 4px 6px;
        overflow-anchor: none;
        background: #262626;
        border: 1px solid #3e3e3e;
        border-radius: 5px;
        font-variant-numeric: tabular-nums;
      }
      #history:empty::before {
        content: "Commands and results will appear here.";
        color: #bbb;
      }
      .history-entry {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: baseline;
        column-gap: 5px;
        padding-block: 2px;
        line-height: 1.4;
      }
      .entry-time,
      .entry-duration {
        font-size: 10px;
        color: #a0a0a0;
        white-space: nowrap;
      }
      .entry-label {
        min-width: 0;
      }
      .history-started .entry-label {
        color: #aaa;
      }
      .history-succeeded .entry-label {
        color: #eee;
      }
      .history-failed .entry-label,
      .history-uncertain .entry-label,
      .history-rejected .entry-label,
      .entry-message {
        color: #f28b82;
      }
      .entry-message {
        grid-column: 2 / -1;
        font-size: 11px;
        white-space: pre-wrap;
        margin-top: 3px;
      }
      .history-info .entry-label {
        color: #aaa;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition:
            background-color 120ms ease-out,
            border-color 120ms ease-out,
            color 120ms ease-out;
        }
        @supports (-webkit-background-clip: text) {
          /* Only the active label shimmers; completed rows have no animation. */
          .history-started .entry-label {
            background-image: linear-gradient(
              110deg,
              #aaa 0%,
              #aaa 42%,
              #eee 50%,
              #aaa 58%,
              #aaa 100%
            );
            background-size: 250% 100%;
            background-position: 100% 0;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: action-shimmer 3s linear infinite;
          }
        }
      }
      @keyframes action-shimmer {
        0% {
          background-position: 100% 0;
        }
        82%,
        100% {
          background-position: 0% 0;
        }
      }
      @media (forced-colors: active) {
        .history-started .entry-label {
          background: none;
          -webkit-text-fill-color: CanvasText;
          animation: none;
        }
      }
      @media (max-width: 280px) {
        .history-entry {
          grid-template-columns: auto minmax(0, 1fr);
        }
        .entry-duration {
          grid-column: 2;
        }
      }
      details {
        color: var(--host-panel-text, #bcbcbc);
        font-size: 11px;
        flex: 0 0 auto;
      }
      details[open] {
        max-height: 40vh;
        overflow: hidden;
      }
      details p {
        margin-top: 8px;
        overflow-wrap: anywhere;
      }
      summary {
        display: flex;
        align-items: baseline;
        gap: 6px;
        list-style: none;
        cursor: pointer;
        min-height: 24px;
        padding-block: 4px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary > span:first-of-type {
        flex-shrink: 0;
      }
      summary::before {
        content: "";
        flex: 0 0 auto;
        width: 5px;
        height: 5px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: translateY(-1px) rotate(-45deg);
      }
      details[open] summary::before {
        transform: translateY(-2px) rotate(45deg);
      }
      dl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 4px 12px;
        margin: 8px 0 0;
      }
      dt {
        color: var(--host-panel-muted, #a0a0a0);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main aria-label="MCP Bridge">
      <h1 class="sr-only">MCP Bridge</h1>
      <div class="history-heading">
        <h2 id="history-label">Command History</h2>
        <div class="history-actions">
          <button
            id="pause"
            type="button"
            aria-label="Pause commands"
            title="Pause commands"
            disabled
          >
            <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M5.5 4v8m5-8v8" />
            </svg>
            <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="m5.5 3.5 7 4.5-7 4.5Z" />
            </svg>
          </button>
          <button
            id="export-history"
            type="button"
            aria-label="Export command history"
            title="Export command history"
            disabled
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M8 2.5v7m-3-3 3 3 3-3M3 10v3h10v-3" />
            </svg>
          </button>
          <button
            id="clear-history"
            type="button"
            aria-label="Clear command history"
            title="Clear command history"
            disabled
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M2.5 4.5h11M6 4.5v-2h4v2m-6.5 0 .75 9h7.5l.75-9M6.5 7v4m3-4v4" />
            </svg>
          </button>
        </div>
      </div>
      <div id="history" role="log" aria-live="off" aria-labelledby="history-label"></div>
      <details>
        <summary>
          <span>Connection details</span>
          <span id="status" role="status" aria-live="polite">Connecting…</span>
        </summary>
        <dl>
          <dt>Version</dt>
          <dd id="version">—</dd>
          <dt>Bridge folder</dt>
          <dd id="bridge-folder">—</dd>
        </dl>
        <p>Keep this panel open. Close After Effects dialogs before sending commands.</p>
      </details>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
